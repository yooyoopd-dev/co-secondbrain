# Windows 배포본을 만든다. 사내 PC 에도 이 컨테이너에도 Windows 빌드 환경이 없어
# (ROADMAP 20번) 여기가 유일한 exe 생산지다.
#
# 만든 것을 그냥 올리지 않는다. **묶은 것을 실제로 띄워 스모크 20건을 통과시킨 뒤에만**
# 릴리스로 간다. asar 안의 main·preload 가 도는지는 소스로 도는 검사가 말해 주지 않는다.
name: release

# 태그를 밀거나 Actions 화면에서 직접 돌릴 때만 만든다. 아무 때나 도는 것을 막는다 —
# 문서만 고쳐도 10분짜리 Windows 빌드가 돌면 낭비다.
#
# 판 번호는 `app/package.json` 이 갖고 있다. 같은 판으로 다시 돌리면 릴리스 자산만
# 덮어쓴다. 새 판을 내려면 그 파일의 `version` 부터 올린다.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: 의존성
        working-directory: app
        run: npm ci

      # 시험용 원본(docx·xlsx·pptx·pdf·eml·vtt)은 저장소에 안 담는다. 실제 라이브러리로
      # 만들어 실제 라이브러리로 읽는 것이 요점이라 여기서 만든다 (spikes/fixtures/make.mjs).
      # `spikes/package-lock.json` 은 저장소에 안 담겨 있어 `npm ci` 를 못 쓴다.
      # pwsh 는 외부 명령이 실패해도 다음 줄로 넘어가므로 종료 코드를 직접 본다.
      - name: 시험용 원본 만들기
        working-directory: spikes
        run: |
          npm install --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit 1 }
          node fixtures/make.mjs

      - name: 검사 (타입 + 단위)
        working-directory: app
        run: npm run check

      - name: 빌드
        working-directory: app
        run: npm run build

      - name: 단일 exe 로 묶는다
        working-directory: app
        run: npx electron-builder --win --publish never

      # 여기가 이 워크플로의 핵심이다. 푼 것을 띄워 window.sb 표면까지 확인한다.
      # 포터블 exe 는 자기를 풀고 자식을 띄우는 껍데기라 win-unpacked 쪽을 잡는다.
      - name: 묶은 것이 실제로 뜨는가
        working-directory: app
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: |
          npm i -g playwright
          $exe = Join-Path (Resolve-Path release/win-unpacked) 'co-secondbrain.exe'
          if (-not (Test-Path $exe)) { throw "푼 실행 파일이 없습니다: $exe" }
          $env:SB_SMOKE_EXE = $exe
          node ../spikes/app/smoke.mjs

      # 허브는 Ubuntu 에서 돌지만 만드는 것은 `tsc` 뿐이라 어디서 빌드해도 결과가 같다.
      # 런타임 의존성이 없어서 `dist/` 와 `deploy/` 만 담으면 끝이다 (HUB-SETUP.md §3).
      - name: 허브 묶음
        working-directory: hub
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit 1 }
          npm run check
          if ($LASTEXITCODE -ne 0) { exit 1 }
          npm run build
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $v = (Get-Content ../app/package.json -Raw | ConvertFrom-Json).version
          tar -czf "../app/release/co-hub-$v.tgz" dist deploy README.md
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: co-secondbrain-portable
          path: |
            app/release/*.exe
            app/release/*.tgz
          if-no-files-found: error

      - name: 배포
        env:
          GH_TOKEN: ${{ github.token }}
        run: pwsh .github/scripts/publish.ps1
