<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>co-secondbrain</title>
  <!-- 첨부 PNG 를 보고 다시 그린 것이다. 원본 이진 파일이 컨테이너에 오지 않아
       픽셀을 지우는 대신 같은 구성을 벡터로 옮겼다. 바깥은 투명이다 —
       원본의 판 밖 배경은 넣지 않는다. 색은 design/design.md 의 토큰이다. -->

  <!-- 판. 바깥 테와 안쪽 면을 나눠 원본의 도톰한 가장자리를 낸다 -->
  <rect x="18" y="18" width="476" height="476" rx="120" fill="#efece2"/>
  <rect x="30" y="30" width="452" height="452" rx="110" fill="#fcfbf8"/>
  <rect x="52" y="52" width="408" height="408" rx="92" fill="none" stroke="#eceae4" stroke-width="4"/>

  <!-- 뇌. 열넷으로 나눈 타원에 바깥으로 부푼 호를 이어 붙였다.
       흰 테두리를 한 겹 깔아 원본의 스티커 느낌을 낸다.
       모양은 defs 에 두고 색은 use 쪽에서 준다 — path 에 붙은 속성이 use 를 이긴다 -->
  <defs>
    <path id="brain" d="M256 140 A37.9 37.9 0 0 1 315.9 152.1 A36.4 36.4 0 0 1 363.9 185.9 A34.5 34.5 0 0 1 390.5 234.9 A33.7 33.7 0 0 1 390.5 289.1 A34.5 34.5 0 0 1 363.9 338.1 A36.4 36.4 0 0 1 315.9 371.9 A37.9 37.9 0 0 1 256 384 A37.9 37.9 0 0 1 196.1 371.9 A36.4 36.4 0 0 1 148.1 338.1 A34.5 34.5 0 0 1 121.5 289.1 A33.7 33.7 0 0 1 121.5 234.9 A34.5 34.5 0 0 1 148.1 185.9 A36.4 36.4 0 0 1 196.1 152.1 A37.9 37.9 0 0 1 256 140 Z"/>
  </defs>
  <use href="#brain" fill="#f7f4ed" stroke="#ffffff" stroke-width="34" stroke-linejoin="round"/>
  <use href="#brain" fill="#f7f4ed" stroke="#1c1c1c" stroke-width="16" stroke-linejoin="round"/>

  <!-- 좌우 반구를 가르는 세로 주름. 악수가 가리는 데서 끊는다.
       위쪽에 말림을 넣으면 아래 회색 점과 짝을 이뤄 눈처럼 읽힌다 — 넣지 않는다 -->
  <path d="M256 142 C249 166 262 176 256 198 C251 214 259 220 256 232"
    fill="none" stroke="#1c1c1c" stroke-width="15" stroke-linecap="round"/>

  <!-- 신경망. 뇌 안쪽 윤곽을 따라 짧게 붙인다 -->
  <g fill="none" stroke="#5f5f5d" stroke-width="9" stroke-linecap="round">
    <path d="M222 160 L204 180"/>
    <path d="M290 160 L308 180"/>
    <path d="M170 306 L196 322"/>
    <path d="M342 306 L316 322"/>
  </g>
  <g fill="#5f5f5d">
    <circle cx="224" cy="158" r="9"/>
    <circle cx="288" cy="158" r="9"/>
    <circle cx="202" cy="183" r="12"/>
    <circle cx="310" cy="183" r="12"/>
    <circle cx="168" cy="304" r="12"/>
    <circle cx="344" cy="304" r="12"/>
    <circle cx="198" cy="325" r="12"/>
    <circle cx="314" cy="325" r="12"/>
  </g>
  <g fill="#1c1c1c">
    <circle cx="150" cy="252" r="13"/>
    <circle cx="362" cy="252" r="13"/>
  </g>

  <!-- 악수. 양쪽 팔뚝이 가운데로 내려와 맞잡는다. 원본처럼 뇌 아래쪽 절반을 채운다.
       테두리를 먼저 다 긋고 안쪽을 나중에 채운다 — 이음매가 지워져 한 덩어리가 된다 -->
  <g fill="none" stroke-linecap="round">
    <path d="M158 246 C198 264 226 292 256 314 C286 292 314 264 354 246" stroke="#1c1c1c" stroke-width="72"/>
    <path d="M222 258 C242 244 272 244 292 256" stroke="#1c1c1c" stroke-width="46"/>
    <path d="M158 246 C198 264 226 292 256 314 C286 292 314 264 354 246" stroke="#f7f4ed" stroke-width="50"/>
    <path d="M224 260 C242 248 272 248 290 258" stroke="#f7f4ed" stroke-width="24"/>
  </g>

  <!-- 맞물린 손가락 넷. 팔뚝 띠의 중심선 위에 수직으로 얹는다 —
       좌표를 눈으로 찍으면 띠 밖으로 삐져나와 낙서처럼 보인다.
       32px 로 줄면 뭉치므로 이것만 남긴다 -->
  <g fill="none" stroke="#1c1c1c" stroke-width="11" stroke-linecap="round">
    <path d="M216 261 L196 289"/>
    <path d="M232 274 L211 301"/>
    <path d="M248 286 L227 313"/>
    <path d="M263 298 L242 325"/>
  </g>
</svg>
