# 단일 exe 로 묶는 설정. `npm run dist` 가 이 파일을 읽는다.
#
# 사내 PC 에는 설치 권한이 없을 수 있어 **설치하지 않고 그대로 실행하는 포터블 한 개
# 파일**을 만든다. 받아서 두 번 누르면 끝이다 (ROADMAP 20번).
appId: com.yooyoopd.co-secondbrain
productName: co-secondbrain

directories:
  # 기본값이 `dist/` 인데 거기에는 이미 컴파일된 main·renderer 가 들어 있다. 겹치면 서로 지운다.
  output: release

# 개발 의존성은 electron-builder 가 스스로 뺀다. 여기 적는 것은 우리가 만든 것뿐이다.
files:
  - dist/**
  - package.json

win:
  icon: ../design/icon/icon.ico
  target:
    - target: portable
      arch: [x64]

portable:
  artifactName: ${productName}-${version}-portable.${ext}
  # 한글 경로에서 풀리는 자리를 만든다. 사내 계정 이름이 한글인 경우가 흔하다.
  unicode: true
